<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciamento de Usuários | CodeCamp</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/usuarios.css">
    <link rel="stylesheet" href="css/global.css">
    <script type="module" src="js/usuarios.js"></script>
    <script type="module" src="js/logout.js"></script>
  </head>
  <body class="gradient-bg">
    <aside class="sidebar" aria-label="Menu principal">
      <a class="brand" href="dashboard.html" aria-label="CodeCamp, página inicial">
        <span class="brand__mark" aria-hidden="true">CC</span>
        <span>CodeCamp</span>
      </a>

      <nav aria-label="Navegação principal">
        <ul class="sidebar__links">
          <li><a class="sidebar__link" href="cursos.html">Cursos</a></li>
          <li><a class="sidebar__link" href="modulos.html">Módulos</a></li>
          <li><a class="sidebar__link" href="usuarios.html">Usuários</a></li>
          <li><a class="sidebar__link" href="estudantes.html">Estudantes</a></li>
          <li><a class="sidebar__link" href="empresas.html">Empresas</a></li>
        </ul>
      </nav>
      <button class="sidebar__logout" type="button">Sair</button>
    </aside>

    <main class="main-content">
      <div class="main-content__inner users-page">
        <header class="users-page__header">
          <div>
            <p class="users-page__eyebrow">Administração</p>
            <h1>Gerenciamento de Usuários</h1>
          </div>
          <button id="add-user-button" class="primary-button" type="button">
            <span aria-hidden="true">+</span>
            Adicionar Usuário
          </button>
        </header>

        <section class="users-section glass" aria-labelledby="users-list-title">
          <div class="users-section__heading">
            <h2 id="users-list-title">Usuários cadastrados</h2>
            <p id="users-feedback" class="users-feedback" role="status" aria-live="polite">Carregando usuários...</p>
          </div>

          <div class="users-table-wrap">
            <table class="users-table">
              <thead>
                <tr>
                  <th scope="col">Nome</th>
                  <th scope="col">CPF</th>
                  <th scope="col">Status</th>
                  <th scope="col">Empresa</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr>
                  <td class="users-table__placeholder" colspan="4">Buscando dados...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
